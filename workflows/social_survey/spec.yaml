        "Elephants have a Negative Effect on my Income/Livelihood. (Einyal ilkanjaoni ntumot inonok)": "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants move to Different Areas depending on the Season for Food and Water (Eidurr ilkanjaoni ing’oru enkare oo ndaat)": "Elephants move to Different Areas depending on the Season for Food and Water",
