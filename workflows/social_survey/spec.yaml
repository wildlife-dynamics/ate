        "If 'Other' What is your Tribe? (Masai Translation)": "If 'Other' What is your Tribe",
        "If 'Other' Which of these Threats do you Consider as the Greatest Threat to Successful Crop Production? (Masai Translation)": "If 'Other' Which of these Threats do you Consider as the Greatest Threat to Successful Crop Production",
        "If 'Other', Which of the Following do You think Will Help you in the Future Deal with Elephants? (Masai Translation)": "If 'Other', Which of the Following do You think Will Help you in the Future Deal with Elephants",
