        "If Yes, in What Capacity? (Enaa ee, tia oitoi)": "If Yes, in What Capacity",
        "If you Benefit from the Fence, do You Pay into the Maintenance Fund of the Fence? If no, Why? (Enaa ee, ilakita ropiyani naitobirieki ilositima? Enaa aa, kanyoo)": "If you Benefit from the Fence, do You Pay into the Maintenance Fund of the Fence? If no, Why",
