        "How many Dogs does Your Household Own? (Kebaa eramatare ino (ildiain)?)": "How many Dogs does Your Household Own",
        "How many Donkey does Your Household Own?(Kebaa eramatare ino (sirkon)?)": "How many Donkey does Your Household Own",
        "How many Other Animals does Your Household Own? (Kebaa eramatare ino (nkuliek)?)": "How many Other Animals does Your Household Own",
        "How many People are there in your Household? (Kaja iltung’anak oomanya enaaji ino?)": "How many People are there in your Household",
        "How many Sheep/Goats does Your Household Own? (Kebaa eramatare ino (ntare)?)": "How many Sheep/Goats does Your Household Own",
        "How many Years have You Lived in this Area? (Kaja larin liata imanya tena kutoto?)": "How many Years have You Lived in this Area",
        "How much Land do you Grow Crops on each Season (in Acres)? (Kebaya aa olchamba lianiturr?)": "How much Land do you Grow Crops on each Season (in Acres)",
