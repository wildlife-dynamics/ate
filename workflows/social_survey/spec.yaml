# Filter out only agree-disagree columns 
  - name: Retain agree disagree columns
    id: retain_agree_disagree 
    task: map_columns
    partial: 
      df: ${{ workflow.order_bins.return }}
      drop_columns: []
      retain_columns: [
        "id",
        "time",
        "serial_number",
        "geometry",
        "What is your Age Group",
        "What is your Highest Level of Completed Education",
        "What is your Tribe",
        "What is your marital status",
        "Gender of Participant",

        "How many People are there in your Household",
        "What is your Age",
        "Elephants Hurt Members of my Community",
        "Elephants Negatively Impact my Emotional Wellbeing",
        "Elephants are Important for a Healthy Ecosystem",
        "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants should only Live Inside the Parks",

        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
        "It is Acceptable to Harm Elephants if they have Hurt People",
        "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area",
      ]
      rename_columns: {}
      raise_if_not_found: false

  - name: Retain true-false columns
    id: retain_true_false 
    task: map_columns
    partial: 
      df: ${{ workflow.order_bins.return }}
      drop_columns: []
      retain_columns: [
        "id",
        "time",
        "serial_number",
        "geometry",

        "A Male Elephant that has a Secretion on its Face and Dribbling Urine from his Penis may be More Aggressive",
        "An Elephant is Aware of a Person's Presence when it Raises its Trunk Above its Head and Pointing in the Direction of the Person",
        "An Elephant may Shake its Head if it is Annoyed by your Presence",
        "Elephants can Smell and Hear from Very Far Away",
        "Elephants move to Different Areas depending on the Season for Food and Water",
        "Female Elephants are Protective over their Young",
        "Female Elephants live in Family Groups",
        "Have You ever been Involved in or Witnessed an Elephant being Harmed",
      ]
      rename_columns: {}
      raise_if_not_found: false

  - name: Retain yes-no columns
