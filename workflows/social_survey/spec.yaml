id: crop_raid_report
requirements:
  - name: ecoscope-platform
    version: "2.18.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "1.0.5.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.0.2.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ate
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # Set workflow details 
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details
  
  # Define time range 
  - name: Time Range
    id: time_range
    task: set_time_range

  # Define groupers 
  - name: Set Data Grouping
    id: groupers
    task: set_groupers
    partial:
      groupers: []

  #  Connect to ER 
  - name: Connect to EarthRanger
    id: er_client_name 
    task: set_er_connection

  # Set basemaps connection 
  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20
        - url: >-
            https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
          opacity: 0.15
          max_zoom: 20

  # Download Amboseli Layers and style them 
  - name: Download amboseli conservancy layers
    id: ambo_ranch_layers
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/wrcp3pnnxqyrclzmbtt1r/amboseli_ranch_conservancies_layers.gpkg?rlkey=jfbqj1b1nwhijxbsy7b2v1d29&st=d7rbqdfe&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3 
      unzip: false 
  
  - name: Download amboseli ranch boundaries and electric fence
    id: ambo_bound_fence 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/k6dgrmxmxeb3fe6glihwa/amboseli_group_ranch_boundaries_x_electric_fence.gpkg?rlkey=limtzffe88lr0iof5kf3b6uoy&st=rreho3tq&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download ambo conservancies 
    id: ambo_conservancies 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/blo1smf49buhwx24y4z60/amboseli_group_ranch_boundaries.gpkg?rlkey=w86emavj8ug7zab73ifbzg6jv&st=v8uptlb0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Load amboseli conservancy layers 
    id: load_ambo_layers 
    task: load_df 
    partial:  
      file_path: ${{ workflow.ambo_ranch_layers.return }}
      layer: null 
      deserialize_json: false 

  - name: Load amboseli ranch boundaries and electric fence 
    id: load_ambo_boundaries_fence 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_bound_fence.return }}
      layer: null 
      deserialize_json: false 
  
  - name: Load amboseli conservancies 
    id: load_ambo_conservancies 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_conservancies.return }}
      layer: null 
      deserialize_json: false 

  - name: Reproject gdf to 4326 for ambo layers 
    id: reproject_ambo_layers 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_layers.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo boundaries and electric fence 
    id: reproject_ambo_boundaries 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_boundaries_fence.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo conservancies
    id: reproject_ambo_conservancies
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_conservancies.return }}
      target_crs: "EPSG:4326"

  - name: Apply colormap to amboseli land_use column
    id: apply_ambo_color
    task: apply_color_map
    partial:
      df: ${{ workflow.reproject_ambo_layers.return }}
      input_column_name: land_use
      output_column_name: land_use_color
      colormap:
        Rangeland: "#a39c91"
        Rangeland and settlement: "#ffa07a"
        Settlement and agriculture: "#2f4f4f"
        Conservancies: "#8fbc8b"
        National parks and reserves: "#4d6600"

  - name: Create amboseli land_use layer
    id: create_land_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.apply_ambo_color.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: land_use_color
        get_line_color: land_use_color
        get_line_width: 0.85
        opacity: 0.75
      legend:
        title: Map Layers
        values:
          - label: Conservancies
            color: "#8fbc8b"

          - label: National park and reserves
            color: "#4d6600"

          - label: Settlement and agriculture
            color: "#2f4f4f"

          - label: Rangeland
            color: "#a39c91"

          - label: Rangeland and settlement
            color: "#ffa07a"

  - name: Filter to ambo ranch boundaries only
    id: filter_ambo_boundaries
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Ranch boundaries
      reset_index: true

  - name: Filter to ambo electric fence only
    id: filter_ambo_fence
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Electric Fence
      reset_index: true

  - name: Create ambo ranch boundaries layer
    id: create_bound_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_ambo_boundaries.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [0, 0, 0]
        get_line_width: 0.95
        opacity: 0.55
      legend:
        title: ""
        values:
          - label: Ranch boundaries
            color: "#000000"

  - name: Create ambo electric fence layer
    id: create_fence_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_ambo_fence.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [45, 98, 177]
        get_line_width: 5.5
        opacity: 1.0
      legend:
        title: ""
        values:
          - label: Electric fence
            color: "#2d62b1"
  
  - name: Retrieve ATE Survey Events 
    id: get_survey_events 
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details

      event_types:
        - "atequestionnaire_rep"
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: true
      force_point_geometry: true 

  - name: Extract date from survey data
    id: extract_event_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_survey_events.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Process survey events details
    id: process_survey_details
    task: ecoscope_workflows_ext_custom.tasks.io.process_events_details
    partial: 
      df: ${{ workflow.extract_event_date.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true 

  - name: Normalize Survey Event Column Names
    id: normalize_survey_events 
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_survey_details.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  - name: Drop column prefix from events
    id: drop_survey_prefix 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_column_prefix
    partial: 
      df: ${{ workflow.normalize_survey_events.return }}
      prefix: event_details__
      duplicate_strategy: keep_original 

  - name: Rename and Filter Event Columns
    id: map_survey_columns 
    task: map_columns
    partial: 
      df: ${{ workflow.drop_crop_prefix.return }}
      drop_columns: [
        "event_type_display",
        "event_type",
        ]
      retain_columns: []
      rename_columns: {
        "A Male Elephant that has a Secretion on its Face and Dribbling Urine from his Penis may be More Aggressive? (Eitau olee lolkanjaoi enkare tenkomom neisirisir nkulak nepeiyu sii)": "A Male Elephant that has a Secretion on its Face and Dribbling Urine from his Penis may be More Aggressive",
        "An Elephant is Aware of a Person's Presence when it Raises its Trunk Above its Head and Pointing in the Direction of the Person?  (Eyolou olkanjaoi entii oltung’ani teneilepie enkaina shumata elukunya enye ing’orie inaalo natii)": "An Elephant is Aware of a Person's Presence when it Raises its Trunk Above its Head and Pointing in the Direction of the Person",
        "An Elephant may Shake its Head if it is Annoyed by your Presence? (Eipiripir olkanjaoi elukunya teneitagor etii ino)": "An Elephant may Shake its Head if it is Annoyed by your Presence",
        "Are there any Other Benefits from Elephants that were Not Said Yet? (Ketii enkae dupoto naata ilkanjaoni neitu kiimaki?)": "Are there any Other Benefits from Elephants that were Not Said Yet",
        "Are there any Other Costs from Elephants that were Not Said Yet? (Ketii enkae toroni naata ilkanjaoni neitukiimaki?)": "Are there any Other Costs from Elephants that were Not Said Yet",
        "Do you Benefit from the KCCDT Big Life Electric Fence? (Itumito dupoto te KCCDT arashu ositima le Big Life)": "Do you Benefit from the KCCDT Big Life Electric Fence",
        "Do you Choose Walking/Grazing Routes Walking Schedules, or Fetching Water based on Elephant Presence? (Imbelekeny olkuak (ilgoso/saai) too ndaat arashu eokunoto enkare tentiaraki entii olkanjaoni?)": "Do you Choose Walking/Grazing Routes Walking Schedules, or Fetching Water based on Elephant Presence",
        "Do you Protect where you Get Water from Elephants? (Keripi ine weji niokunye enkare?)": "Do you Protect where you Get Water from Elephants",
        "Do you See More Elephants now Compared to the Past?  (Idol ilkanjaoni kumok taata alang’ enkata natulusoiye?)": "Do you See More Elephants now Compared to the Past",
        "Do you and your Family use any Measures to Prevent Elephants from Causing Damage to your Crops? (Ketii nkoitoi nimboririe ilkanjaoni pee meinyal ilchambai linyi enaa olmarei?)": "Do you and your Family use any Measures to Prevent Elephants from Causing Damage to your Crops",
        "Do you and your Family use any Measures to Prevent Injuring your Livestock?  (Ketii nkoitoi nimboririe ilkanjaoni pee meinyal eramatare inyi enaa olmarei?)": "Do you and your Family use any Measures to Prevent Injuring your Livestock",
        "Elephants Hurt Members of my Community. (Einyal ilkanjaoni loopeny enkutoto)": "Elephants Hurt Members of my Community",
