        "Female Elephants are Protective over their Young (Erip supeni olkanjaoni nkera enye)": "Female Elephants are Protective over their Young",
        "Female Elephants live in Family Groups (Etoni supeni olkanjaoni enaa ilmareita)": "Female Elephants live in Family Groups",
        "Have You Noticed any Signs or Symptoms of Illness in the Wild Animals (Elephant, Lion, Hyena, etc.)? (Etadua erbulabul le emoyian oo Ng'uesi)": "Have You Noticed any Signs or Symptoms of Illness in the Wild Animals (Elephant, Lion, Hyena, etc.)",
        "Have You ever been Involved in or Witnessed an Elephant being Harmed? (Itaara arashu itadua olkanjaoi eariratai?)": "Have You ever been Involved in or Witnessed an Elephant being Harmed",
        "Having Elephants in this Area is (Entii olkanjaoni tena kutoto):": "Having Elephants in this Area is",
