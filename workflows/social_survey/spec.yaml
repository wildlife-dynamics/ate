        "In the Last Year, how Often have you Seen Elephants in this Area?  (Kamaa tiatua olari otulusoiye, kekatitin naabaa idol ilkanjaoni?)": "In the Last Year, how Often have you Seen Elephants in this Area",
        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock. (Enarikino neari olkanjaoi oinyalishe)": "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
