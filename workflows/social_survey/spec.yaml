# ${{ workflow.replace_bins_mapping.return }} -- draw 3 maps
  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        partial:
          gdf: ${{ workflow.replace_bins_mapping.return }} 
          expansion_factor: 1.05

      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
          gdf: ${{ workflow.zoom_to_envelope.return }}

  - name: Generate survey events scatterplot layer
    id: generate_survey_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    skipif:
      conditions: 
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      data_url: null
      layer_style:
        get_fill_color: [220, 20, 60]
        get_line_color: [220, 20, 60]
        get_line_width: 0.25
        get_radius : 4
        opacity: 0.75
        stroked: true
      legend: 
        title: "Legend"
        values:
          - label: "Survey Location"
            color: "#dc143c"
      geodataframe: ${{ workflow.replace_bins_mapping.return }} 

  - name: Overlay survey eventson Amboseli Map
    id: combine_surv_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_land_layer.return }}
        - ${{ workflow.create_bound_layer.return }}
        - ${{ workflow.create_fence_layer.return }}
      grouped_layers: 
        - ${{ workflow.generate_survey_layer.return }}

  - name: Draw survey events map
    id: draw_survey_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_surv_layers.return }}
      view_state: ${{ workflow.gdf_image_extent.return }} 

  - name: Persist survey  event map
    id: persist_survey_map
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_response_map.return }}
      filename: survey_event_map.html  # -- convert this to png

