# Agree-Disagree
# Filter out only agree-disagree columns 
  - name: Retain agree disagree columns
    id: filter_agree_disagree 
    task: map_columns
    partial: 
      df: ${{ workflow.retain_agree_disagree.return }}
      drop_columns: []
      retain_columns: [
        "Elephants Hurt Members of my Community",
        "Elephants Negatively Impact my Emotional Wellbeing",
        "Elephants are Important for a Healthy Ecosystem",
        "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants should only Live Inside the Parks",

        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
        "It is Acceptable to Harm Elephants if they have Hurt People",
        "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area",
      ]
      rename_columns: {}
      raise_if_not_found: false

  - name: Create agree-disagree likert chart 
    id: agree_disgree_chart 
    task: create_likert_chart 
    partial: 
      dataframe: ${{ workflow.filter_agree_disagree.return }}
      response_order: [
        "Strongly Disagree", 
        "Disagree", 
        "Neutral", 
        "Agree", 
        "Strongly Agree"
      ]
      likert_style: 
        colors: {
            "Strongly Disagree": "#2c5282",
            "Disagree": "#4299e1",
            "Neutral": "#a0aec0",
            "No Response": "#a0aec0",
            "I Don’t Know": "#a0aec0",
            "Agree": "#ed8936",
            "Strongly Agree": "#c05621",
        }
        neutral_categories: null 
        show_percentage: true 
        sort_questions: false
        sort_by: positive 
      layout_style: 
        bargap: 0.05
        bargapgroup: 0.05
        title: null 
        title_x: 0.01
        title_y: 0.95
        showlegend: true 
        font_size: 10 
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: ""
          range: null
        yaxis:
          title: ""
          range: null 
        widget_id: null

  - name: Persist agree disagree likert chart
    id: persist_likert_chart
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.agree_disgree_chart.return }}
      filename: "ele_sentiment_chart.html"
  
  - name: Replace agree disagree columns with negative values 
    id: replace_negative
    task: replace_column_values 
    partial: 
      df: ${{ workflow.retain_agree_disagree.return }}
      columns: [
        "Elephants Hurt Members of my Community",
        "Elephants should only Live Inside the Parks",
        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
        "It is Acceptable to Harm Elephants if they have Hurt People",
        "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants Negatively Impact my Emotional Wellbeing",
      ]
      value_map: {
        "I Don’t Know": 0,
        "No Response": 0,
        "Strongly Disagree": 5,
        "Disagree": 4,
        "Neutral": 3,
        "Agree": 2,
        "Strongly Agree": 1,
      }
      inplace: true 
      errors: ignore 

  - name: Replace agree disagree columns with positive values 
    id: replace_positive
    task: replace_column_values 
    partial: 
      df: ${{ workflow.replace_negative.return }}
      columns: [
        "Elephants are Important for a Healthy Ecosystem",
        "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area",
        
      ]
      value_map: {
        "I Don’t Know": 0,
        "No Response": 0,
        "Strongly Disagree": 1,
        "Disagree": 2,
        "Neutral": 3,
        "Agree": 4,
        "Strongly Agree": 5,
      }
      inplace: true 
      errors: ignore 
  
  - name: Convert elephant sentiment scores to int 
    id: convt_ele_int 
    task: convert_columns_to_int
    partial: 
      df: ${{ workflow.replace_positive.return }}
      columns: [
        "Elephants Hurt Members of my Community",
        "Elephants should only Live Inside the Parks",
        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
        "It is Acceptable to Harm Elephants if they have Hurt People",
        "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants Negatively Impact my Emotional Wellbeing",

        "Elephants are Important for a Healthy Ecosystem",
        "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area",
      ]
      errors: "coerce"
      fill_value: 0

  - name: Create sentiment score 
    id: create_sentiment_score 
    task: apply_arithmetic_operation_over_rows
    partial: 
      df: ${{ workflow.convt_ele_int.return }}
      columns: [
        "Elephants Hurt Members of my Community",
        "Elephants should only Live Inside the Parks",
        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
        "It is Acceptable to Harm Elephants if they have Hurt People",
        "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants Negatively Impact my Emotional Wellbeing",

        "Elephants are Important for a Healthy Ecosystem",
        "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area",
      ]
      output_column: "sentiment_score"
      operation: add

  - name: Create sentiment score mean 
    id: sentiment_score_mean 
    task: apply_arithmetic_operation_over_rows
    partial: 
      df: ${{ workflow.create_sentiment_score.return }}
      columns: [
        "Elephants Hurt Members of my Community",
        "Elephants should only Live Inside the Parks",
        "It is Acceptable to Harm Elephants if they have Damaged Physical Property or Livestock",
        "It is Acceptable to Harm Elephants if they have Hurt People",
        "Elephants have a Negative Effect on my Income/Livelihood",
        "Elephants Negatively Impact my Emotional Wellbeing",

        "Elephants are Important for a Healthy Ecosystem",
        "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area",
      ]
      output_column: "sentiment_score_mean"
      operation: add
  
  - name: Round sentiment score mean 
    id: round_sentiment_score 
    task: round_column_values 
    partial: 
      df: ${{ workflow.sentiment_score_mean.return }}
      column: "sentiment_score_mean"
      output_column: "sentiment_score_mean"
      decimals: 1

  - name: Apply bins to sentiment scores 
    id: sentiment_bins 
    task: apply_classification
    partial: 
      input_column_name: "sentiment_score_mean"
      output_column_name: "sentiment_bins"
      df: ${{ workflow.round_sentiment_score.return }}
      label_options: 
        label_ranges: true 
        label_decimals: 0 
      classification_options: 
        scheme: "equal_interval"
        k: 5
  
  - name: Replace sentiment bins with mapping 
    id: replace_bins_mapping 
    task: replace_column_values 
    partial: 
      df: ${{ workflow.sentiment_bins.return }}
      columns: [
        "sentiment_bins",
        ]
      value_map: {
        "0 - 1":"Strongly Disagree",
        "1 - 2":"Disagree",
        "2 - 3":"Neutral",
        "3 - 4":"Agree",
        "4 - 5":"Strongly Agree",
        }
      inplace: true 
      errors: "ignore"

