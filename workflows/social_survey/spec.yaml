        "It is Important for Elephants to Live in this Area (Tipat tenentii ilkanjaoni enakutoto):": "It is Important for Elephants to Live in this Area",
        "It is Possible for both Humans and Elephants to Live Together in this Area (Idimayu neboita ilkanjaoni oltung’anak tenakutoto)": "It is Possible for both Humans and Elephants to Live Together in this Area",
        "Out of the sources listed, which is the most important source of income for you? (Kaa siai idupore naeng’?)": "Out of the sources listed, which is the most important source of income for you",
        "Overall, how would you describe your feelings about wildlife? (Kamaa teumata, kebaa enyorata ino too ng’uesi?)": "Overall, how would you describe your feelings about wildlife",
        "Please list your Main Sources of Income? (Kaa esiai ino?)": "Please list your Main Sources of Income",
        "Rate how Effective that Practice has been at Protectingn from Damage by Elephants? (Keasisho ina oitoi?)": "Rate how Effective that Practice has been at Protecting from Damage by Elephants",
        "Rate how Effective that Practice has been. (Keasisho ina oitoi)": "Rate how Effective that Practice has been",
        "Select the Two Most Important Priorities for Your Community to Address among these types of Human-Elephant Conflict: (Tengelu nkoitoi are etipat naibooyo orabal oltung’anak olkanjaoni:)": "Select the Two Most Important Priorities for Your Community to Address among these types of Human-Elephant Conflict",
        "Thank you Very Much for Your Time Today (Ashe oleng’ terishata ino)": "Thank you Very Much for Your Time Today",
        "What are the Challenges you Face when Trying to Protect your Farm/Livestock/Water/Property from Elephants? (Kakwa golikinot itumutumu teinaripoto oo nkishu/ enkare/ mali inyi toolkanjaini?)": "What are the Challenges you Face when Trying to Protect your Farm/Livestock/Water/Property from Elephants",
        "What are the Top Three most Common Health Problems or Symptoms affecting Other Animals? (Kakwa bulabul le biotishu okuni oibala temurua ino: nkishu?)": "What are the Top Three most Common Health Problems or Symptoms affecting Other Animals",
        "What are the Top Three most Common Health Problems or Symptoms affecting your Cattle? (Kakwa bulabul le biotishu okuni oibala temurua ino: nkishu?)": "What are the Top Three most Common Health Problems or Symptoms affecting your Cattle",
        "What are the Top Three most Common Health Problems or Symptoms affecting your Dogs? (Kakwa bulabul le biotishu okuni oibala temurua ino: nkishu?)": "What are the Top Three most Common Health Problems or Symptoms affecting your Dogs",
        "What are the Top Three most Common Health Problems or Symptoms affecting your Donkies? (Kakwa bulabul le biotishu okuni oibala temurua ino: nkishu?)": "What are the Top Three most Common Health Problems or Symptoms affecting your Donkies",
        "What are the Top Three most Common Health Problems or Symptoms affecting your Sheep/Goats? (Kakwa bulabul le biotishu okuni oibala temurua ino: nkishu?)": "What are the Top Three most Common Health Problems or Symptoms affecting your Sheep/Goats",
        "What are the Top Three most Concerning Animal Health Issues in Your Community? (Kakwa bulabul e biotishu okuni  oibala tiatua eramatare tenamurua ino ?)": "What are the Top Three most Concerning Animal Health Issues in Your Community",
        "What do You Do when you Encounter Elephants on Foot? (Kanyoo ias teneinapu olkanjaoi iloito too nkejek?)": "What do You Do when you Encounter Elephants on Foot",
        "What do You do if an Animal is Sick or Injured? (Kanyoo ias enemueyu eramatare ino?)": "What do You do if an Animal is Sick or Injured",
        "What is your Age Group? (Ira lialo aji?)": "What is your Age Group",
        "What is your Age?  (Kaja larin liata?)": "What is your Age",
        "What is your Arrangement for the Land that You are Farming On? (Kanyoo mbarakinot lilochamba liturito?)": "What is your Arrangement for the Land that You are Farming On",
        "What is your Highest Level of Completed Education? (Kai itabaiye tenkisoma?)": "What is your Highest Level of Completed Education",
        "What is your Tribe? (Ira olia kutuk?)": "What is your Tribe",
        "What is your marital status? (Iamishe/ iama?, itu iyemisho)": "What is your marital status",
        "What names or types of medicine do you give your animals and how often? (Kakwa keek incho eramatare ino naa ke nkatitin aja?)": "What names or types of medicine do you give your animals and how often",
        "What was the Reason for the Elephant Spearing? (Kanyoo pee etaaraki?)": "What was the Reason for the Elephant Spearing",
        "When People get Sick in the Village, What are the Most Common Symptoms or Diagnoses? (Kama enemoi iltung’anak temurua ino, kakwa bulabul itodolu ?)": "When People get Sick in the Village, What are the Most Common Symptoms or Diagnoses",
        "Which of the Following do You think Will Help you in the Future Deal with Elephants (Select One) (Kamaa tekuna, kakwa oitoi nidol kiret tenkibooroto olkanjaoni too ngolong’i naaponu):": "Which of the Following do You think Will Help you in the Future Deal with Elephants (Select One)",
        "Which of these Threats do you Consider as the Greatest Threat to Successful Crop Production? (kamaa tekuna, kanyoo naata batishu tenturore ino?)": "Which of these Threats do you Consider as the Greatest Threat to Successful Crop Production",
        "Which of these Threats do you Consider the Greatest Threat to your Livestock? (Kamaa tekuna, kanyoo naata batishu teramatare ino?)": "Which of these Threats do you Consider the Greatest Threat to your Livestock",
        "if 'Other' What is your Arrangement for the Land that You are Farming On? (Kanyoo mbarakinot lilochamba liturito?)": "if 'Other' What is your Arrangement for the Land that You are Farming On",
      }
      raise_if_not_found: false

  - name: Exclude invalid serial number 
    id: exclude_invalid_serial
    task: ecoscope_workflows_ext_ste.tasks.filter.filter_rows
    partial: 
      df: ${{ workflow.map_survey_columns.return }}
